apiVersion: v1
kind: Service
metadata:
  name: finance-web
  namespace: finance
spec:
  selector:
    app: finance-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-web
  namespace: finance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finance-web
  template:
    metadata:
      labels:
        app: finance-web
    spec:
      # Espalha as 2 réplicas — inócuo em 1 nó, mas correto se o cluster crescer
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: finance-web
      containers:
        - name: web
          image: localhost:5000/finance-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
