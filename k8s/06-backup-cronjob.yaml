# Backup diário do Postgres.
#
# O PVC do banco é o único ponto com estado do cluster. Perder esse volume
# sem dump é perder o histórico financeiro inteiro.
#
# O dump vai para um PVC SEPARADO do banco, de propósito: backup no mesmo
# volume que ele protege não é backup. Ainda assim ambos vivem no mesmo disco
# do nó (local-path), então isto cobre erro humano e corrupção lógica, não
# falha de disco — para isso, copie os dumps para fora da máquina.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: finance-backups
  namespace: finance
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: finance-postgres-backup
  namespace: finance
spec:
  # 03:00 no fuso do nó.
  schedule: "0 3 * * *"
  # Se o nó estiver desligado na hora marcada, não vale acumular execuções.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              # Mesma major do banco: pg_dump de versão anterior recusa
              # conectar num servidor mais novo.
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  STAMP=$(date +%Y%m%d-%H%M%S)
                  DESTINO="/backups/my_finance-${STAMP}.sql.gz"

                  echo "Gerando ${DESTINO}"
                  # pipefail garante que falha do pg_dump derrube o job,
                  # em vez de gerar um .gz vazio e reportar sucesso.
                  pg_dump -h finance-postgres -U postgres my_finance \
                    | gzip > "${DESTINO}"

                  TAMANHO=$(stat -c%s "${DESTINO}")
                  # Um dump válido nunca é tão pequeno; se for, algo falhou
                  # silenciosamente e é melhor apagar do que guardar lixo
                  # que passaria por backup bom na hora do desespero.
                  if [ "${TAMANHO}" -lt 1024 ]; then
                    echo "ERRO: dump com ${TAMANHO} bytes, suspeito. Descartando."
                    rm -f "${DESTINO}"
                    exit 1
                  fi

                  echo "Verificando integridade do gzip"
                  gzip -t "${DESTINO}"

                  echo "Removendo dumps com mais de 14 dias"
                  find /backups -name 'my_finance-*.sql.gz' -mtime +14 -delete

                  echo "Backups atuais:"
                  ls -lh /backups
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: finance-secrets
                      key: DB_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: finance-backups
