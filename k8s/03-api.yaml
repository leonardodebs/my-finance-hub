apiVersion: v1
kind: Service
metadata:
  name: finance-api
  namespace: finance
spec:
  selector:
    app: finance-api
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-api
  namespace: finance
spec:
  # 1 réplica: o server/index.js roda CREATE TABLE no boot. Recreate evita
  # que duas instâncias executem o DDL ao mesmo tempo durante um deploy.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: finance-api
  template:
    metadata:
      labels:
        app: finance-api
    spec:
      initContainers:
        # Sem isso, se a API subir antes do Postgres, o bloco de CREATE TABLE
        # falha silenciosamente e as tabelas nunca são criadas.
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h finance-postgres -p 5432 -U postgres; do
                echo "aguardando o postgres..."
                sleep 2
              done
              echo "postgres pronto"
      containers:
        - name: api
          image: localhost:5000/finance-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: DB_HOST
              value: finance-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: postgres
            - name: DB_NAME
              value: my_finance
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: finance-secrets
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
