# Job avulso que reaplica o classificador nas transações já gravadas.
# Fica FORA de k8s/ porque o deploy.sh roda "kubectl apply -f k8s/" (não
# recursivo); se estivesse lá, rodaria a cada deploy.
#
# Simulação:  kubectl create -f k8s/jobs/recategorize.yaml
# Aplicando:  edite args para remover --dry-run, ou use o sed do deploy manual.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: finance-recategorize-
  namespace: finance
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: recategorize
          # Substituído pela tag corrente no momento da execução
          image: localhost:5000/finance-api:latest
          command: ["node", "server/recategorize.js"]
          args: ["--dry-run"]
          env:
            - name: DB_HOST
              value: finance-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: postgres
            - name: DB_NAME
              value: my_finance
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-secrets
                  key: DB_PASSWORD
